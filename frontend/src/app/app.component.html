<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">₹</span>
      <div>
        <h1>FinanceFlow</h1>
      </div>
    </div>

    <nav class="nav-links">
      <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        {{ item.label }}
      </a>
    </nav>
  </aside>

  <main class="main-panel">
    <router-outlet />
  </main>
</div>
